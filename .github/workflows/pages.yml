name: Siteyi yayımla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: Node.js hazırla
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Kaynakları kontrol et
        run: npm run check
      - name: Siteyi oluştur
        run: npm run build
      - name: Pages ayarlarını hazırla
        uses: actions/configure-pages@v5
      - name: Site dosyalarını yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Siteyi yayımla
        id: deployment
        uses: actions/deploy-pages@v4
